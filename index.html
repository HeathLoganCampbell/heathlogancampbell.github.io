<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>heath</title>
  <style>
    body { max-width: 40em; margin: 4em auto; padding: 0 1em; line-height: 1.5; font-family: "Times New Roman", Times, serif; }
  </style>
</head>
<body>
  <main>
    <h2>### links ###</h2>
    <ul>
      <li><a href="https://github.com/HeathLoganCampbell" target="_blank" rel="noopener noreferrer">heathlogancampbell@github</a></li>
      <li>
        <a href="#" id="discord" title="copy sprockpls to clipboard">sprockpls@discord</a>
        <span id="status" role="status" aria-live="polite"></span>
      </li>
      <!-- <li><a href="mailto:you@example.com">email</a></li> -->
    </ul>
  </main>

  <script>
    const discord = document.getElementById('discord');
    const status = document.getElementById('status');
    let statusTimer;

    discord.addEventListener('click', async (event) => {
      event.preventDefault();
      const handle = 'sprockpls';
      try {
        await navigator.clipboard.writeText(handle);
      } catch (error) {
        const area = document.createElement('textarea');
        area.value = handle;
        document.body.append(area);
        area.select();
        document.execCommand('copy');
        area.remove();
      }
      status.textContent = '[ copied to clipboard ]';
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => {
        status.textContent = '';
      }, 2000);
    });
  </script>
</body>
</html>
